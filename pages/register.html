<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <title>註冊</title>
</head>

<body>
  <%- include('./layout/header'); -%>
    
    <main class="register-container">
      <div class="container-lg">
        <div class="d-flex justify-content-center align-items-center">
          <div class="logo-wrap">
            <div class="text-center mb-6">
              <h1 class="fs-3 fs-lg-2 fw-bold mb-2">
                歡迎加入 AI ToolVerse
              </h1>
              <p class="fs-lg-5 text-neutral-200">
                立即建立帳號，開始探索 AI 工具
              </p>
            </div>
            <div class="login-btn d-flex flex-column flex-grow-1 mb-6">
              <button type="button" class="btn btn-outline-light py-2 text-primary-100 mb-4">
                <img src="../assets/images/login-google.png" alt="login-google">
                使用 Google 繼續
              </button>
              <button type="button" class="btn btn-outline-light py-2 text-primary-100 mb-4">
                <img src="../assets/images/login-facebook.png" alt="login-facebook">
                使用 Facebook 繼續
              </button>
              <button type="button" class="btn btn-outline-light py-2 text-primary-100">
                <img src="../assets/images/login-apple.png" alt="login-apple">
                使用 Apple 繼續
              </button>
            </div>
            <p class="divider text-neutral-200 fs-sm mb-6">
              或使用 AI ToolVerse 帳號登入
            </p>
            <div>
              <div class="login-input mb-3">
                <label for="userEmail" class="form-label mb-1">電子信箱</label>
                <input type="email"
                  class="form-control text-dark bg-white border border-white border-opacity-12 rounded-3" id="userEmail"
                  placeholder="請輸入電子信箱">
              </div>

              <div class="login-input mb-2">
                <label for="password" class="form-label">密碼</label>
                <div class="position-relative">
                  <input 
                    type="password" 
                    class="form-control text-dark bg-white border border-white border-opacity-12 rounded-3" 
                    id="password" value="" 
                    placeholder="請輸入密碼">
                  <button type="button" class="password-toggle d-none">
                    <i class="bi bi-eye-slash"></i>
                  </button>
                </div>
              </div>
              <div class="login-input mb-2">
                <label for="confirmPassword" class="form-label">確認密碼</label>
                <div class="position-relative">
                  <input 
                    type="password" 
                    class="form-control text-dark bg-white border border-white border-opacity-12 rounded-3" 
                    id="confirmPassword" value="" 
                    placeholder="請再次輸入密碼">
                  <button type="button" class="password-toggle d-none">
                    <i class="bi bi-eye-slash"></i>
                  </button>
                </div>
              </div>
              <div class="mb-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                  <label class="fs-sm form-check-label text-neutral-200" for="flexCheckDefault">
                    我同意 
                    <a href="#" class="fs-sm text-primary-200 text-decoration-underline">
                      服務條款
                    </a>
                    與 
                    <a href="#" class="fs-sm text-primary-200 text-decoration-underline">
                      隱私政策
                    </a>
                  </label>
                </div>
              </div>
              <div class="d-flex flex-column flex-grow-1 mb-6">
                <button class="btn btn-primary rounded-pill text-dark" type="submit">建立帳號</button>
              </div>
              <div class="d-flex justify-content-center align-items-center">
                <p class="fs-sm">
                  已經有帳號了？
                </p>
                <a href="../pages/login.html" class="fs-sm text-primary-200 text-decoration-underline">
                  立即登入
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>


      <script type="module" src="../main.js"></script>
</body>

</html>
